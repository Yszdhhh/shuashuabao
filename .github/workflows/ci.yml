name: CI & Quality Gate

on:
  push:
    branches: [ trial-merge, feat/web-shell-align-20260826, main ]
  pull_request:
    branches: [ trial-merge, main ]

jobs:
  ui-and-backend-gate:
    name: Backend Tests & Baseline Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-v2/package-lock.json

      - name: Install UI Dependencies
        working-directory: ui-v2
        run: npm ci

      - name: Run UI Type Check
        working-directory: ui-v2
        run: npm run check

      - name: Run UI Unit Tests
        working-directory: ui-v2
        run: npm test

      - name: Build UI Production Bundle
        working-directory: ui-v2
        run: npm run build

      - name: Run Core Python Test Suites
        run: |
          python -m pytest tests/test_mediator_choice_four_slot_integration.py tests/test_choice_lexicon.py tests/test_live_tier_crossing_integration.py tests/test_mediator_equipment_fsm_integration.py tests/test_hero_mode_temporal.py tests/test_p0_security.py tests/test_p1_choice_fsm_contracts.py tests/test_dashboard_facade.py tests/test_dashboard_facade_runner.py tests/test_choice_policy.py tests/test_l1_cycle_recheck_merchant.py tests/contract -v
      - name: Run Standard Release Gate
        run: |
          python tools/release_gate.py

  strict-release-gate:
    name: Strict Zero-Defect Release Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow

      - name: Run Strict Release Gate Check
        run: |
          python tools/release_gate.py --strict-release
