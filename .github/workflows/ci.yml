name: CI & Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ trial-merge, feat/web-shell-align-20260826, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ trial-merge, main ]

jobs:
  ui-and-backend-gate:
    name: Backend Tests & Baseline Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-v2/package-lock.json

      - name: Install UI Dependencies
        working-directory: ui-v2
        run: npm ci

      - name: Run UI Type Check
        working-directory: ui-v2
        run: npm run check

      - name: Run UI Unit Tests
        working-directory: ui-v2
        run: npm test

      - name: Build UI Production Bundle
        working-directory: ui-v2
        run: npm run build

      - name: Run Core Python Test Suites
        run: |
          python -m pytest tests -q --tb=short
      - name: Run Standard Release Gate
        run: |
          python tools/release_gate.py

  strict-release-gate:
    name: Strict Zero-Defect Release Gate
    # The repository intentionally carries a real-material BLOCKED
    # disconnect scenario.  Keep ordinary branch CI green with the standard
    # baseline gate; run this zero-defect job only for an explicit release
    # candidate (or a manual audit), where BLOCKED must still stop shipping.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow

      - name: Run Strict Release Gate Check
        run: |
          python tools/release_gate.py --strict-release

  ocr-release-smoke:
    name: Frozen OCR Release Smoke
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: python -m pip install uv

      - name: Build clean frozen distribution
        shell: pwsh
        run: .\build_release.ps1 -SkipGate -NoDeploy

      - name: Boot and exercise frozen OCR worker
        run: python tools/ocr_release_smoke.py
