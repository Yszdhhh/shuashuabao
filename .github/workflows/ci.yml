name: CI & Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ trial-merge, feat/web-shell-align-20260826, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ trial-merge, main ]

jobs:
  ui-and-backend-gate:
    name: Backend Tests & Baseline Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography
          pip install -r requirements-build.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-v2/package-lock.json

      - name: Install UI Dependencies
        working-directory: ui-v2
        run: npm ci

      - name: Run UI Type Check
        working-directory: ui-v2
        run: npm run check

      - name: Run UI Unit Tests
        working-directory: ui-v2
        run: npm test

      - name: Build UI Production Bundle
        working-directory: ui-v2
        run: npm run build

      - name: Run Core Python Test Suites
        run: |
          python -m pytest tests -q --tb=short
      - name: Run Standard Release Gate
        run: |
          python tools/release_gate.py

  strict-release-gate:
    name: Strict Zero-Defect Release Gate
    # The repository intentionally carries a real-material BLOCKED
    # disconnect scenario.  Keep ordinary branch CI green with the standard
    # baseline gate; run this zero-defect job only for an explicit release
    # candidate (or a manual audit), where BLOCKED must still stop shipping.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography
          pip install -r requirements-build.txt

      - name: Run Strict Release Gate Check
        run: |
          python tools/release_gate.py --strict-release

  ocr-release-smoke:
    name: Frozen OCR Release Smoke
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv and signing bootstrap
        run: python -m pip install uv cryptography

      - name: Prepare frozen manifest signing material
        id: manifest-signing
        shell: pwsh
        env:
          MANIFEST_SIGNING_KEY_PEM: ${{ secrets.SHUABAO_MANIFEST_SIGNING_KEY_PEM }}
          MANIFEST_SIGNING_KEY_ID: ${{ secrets.SHUABAO_MANIFEST_SIGNING_KEY_ID }}
          MANIFEST_PUBLIC_KEYS_JSON: ${{ secrets.SHUABAO_MANIFEST_PUBLIC_KEYS_JSON }}
          AUTHENTICODE_CERT_THUMBPRINT: ${{ secrets.SHUABAO_AUTHENTICODE_CERT_THUMBPRINT }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.SHUABAO_AUTHENTICODE_TIMESTAMP_URL }}
          SIGNTOOL_PATH: ${{ secrets.SHUABAO_SIGNTOOL_PATH }}
        run: |
          $privateKey = Join-Path $env:RUNNER_TEMP "ci-manifest-private.pem"
          $publicKeys = Join-Path $env:RUNNER_TEMP "ci-manifest-public-keys.json"
          $keyId = "ci-ephemeral-smoke"
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          if ($isTag) {
            if ([string]::IsNullOrWhiteSpace($env:MANIFEST_SIGNING_KEY_PEM) -or
                [string]::IsNullOrWhiteSpace($env:MANIFEST_SIGNING_KEY_ID) -or
                [string]::IsNullOrWhiteSpace($env:MANIFEST_PUBLIC_KEYS_JSON)) {
              throw "Tagged frozen builds require SHUABAO_MANIFEST_SIGNING_KEY_PEM, _KEY_ID and _PUBLIC_KEYS_JSON secrets."
            }
            [System.IO.File]::WriteAllText($privateKey, $env:MANIFEST_SIGNING_KEY_PEM)
            [System.IO.File]::WriteAllText($publicKeys, $env:MANIFEST_PUBLIC_KEYS_JSON)
            $keyId = $env:MANIFEST_SIGNING_KEY_ID
          }
          else {
            # workflow_dispatch is an offline smoke only: this ephemeral key
            # is under RUNNER_TEMP and no artifact is uploaded or published.
          @'
          import base64, json, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          private = Ed25519PrivateKey.generate()
          Path(sys.argv[1]).write_bytes(private.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          public_der = private.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          Path(sys.argv[2]).write_text(json.dumps({
              "keys": {"ci-ephemeral-smoke": base64.b64encode(public_der).decode("ascii")}
          }), encoding="utf-8")
          '@ | python - $privateKey $publicKeys
          }
          "private_key=$privateKey" >> $env:GITHUB_OUTPUT
          "public_keys=$publicKeys" >> $env:GITHUB_OUTPUT
          "key_id=$keyId" >> $env:GITHUB_OUTPUT

      - name: Build clean frozen distribution
        shell: pwsh
        env:
          SHUABAO_AUTHENTICODE_CERT_THUMBPRINT: ${{ secrets.SHUABAO_AUTHENTICODE_CERT_THUMBPRINT }}
          SHUABAO_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.SHUABAO_AUTHENTICODE_TIMESTAMP_URL }}
          SHUABAO_SIGNTOOL_PATH: ${{ secrets.SHUABAO_SIGNTOOL_PATH }}
          SHUABAO_SUBSCRIPTION_BASE_URL: ${{ secrets.SHUABAO_SUBSCRIPTION_BASE_URL }}
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          $channel = if ($isTag) { "release" } else { "dev" }
          $gate = if ($isTag) { @() } else { @("-SkipGate") }
          $subscriptionUrl = if ($isTag) { $env:SHUABAO_SUBSCRIPTION_BASE_URL } else { "" }
          .\build_release.ps1 @gate -NoDeploy `
            -ReleaseChannel $channel `
            -SubscriptionBaseUrl $subscriptionUrl `
            -ManifestSigningKeyPath "${{ steps.manifest-signing.outputs.private_key }}" `
            -ManifestSigningKeyId "${{ steps.manifest-signing.outputs.key_id }}" `
            -ManifestPublicKeysPath "${{ steps.manifest-signing.outputs.public_keys }}"

      - name: Boot and exercise frozen OCR worker
        run: python tools/ocr_release_smoke.py
