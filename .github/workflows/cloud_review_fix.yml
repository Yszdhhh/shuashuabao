name: Cloud Review Safety Fix

on:
  push:
    branches: [trial-merge]
    paths:
      - '.github/workflows/cloud_review_fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial-merge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed patch
        shell: pwsh
        run: python tools/cloud_apply_review_fix_20260901.py
      - name: Syntax check changed Python
        shell: pwsh
        run: |
          python -m py_compile src/shuabao/mediator.py src/shuabao/log_sink.py src/shuabao/shell/dashboard_facade.py main.py tests/test_desktop_app.py
      - name: Remove one-shot applicator
        shell: pwsh
        run: |
          Remove-Item tools/cloud_apply_review_fix_20260901.py
          Remove-Item .github/workflows/cloud_review_fix.yml
      - name: Commit reviewed fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(safety): close cloud review blockers"
          git push origin HEAD:trial-merge
