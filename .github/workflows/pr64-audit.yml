name: PR64 Temporary Audit

on:
  pull_request:
    branches:
      - claude/round4-live-20260926

jobs:
  audit:
    if: github.head_ref == 'gpt/owner-bond-fallback-20260926'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography
          pip install -r requirements-build.txt

      - name: Strategy and production-path tests
        shell: pwsh
        run: |
          python -m pytest tests/test_choice_policy.py tests/test_p1_choice_fsm_contracts.py tests/test_policy_bond_identity_20260916.py tests/test_owner_pack_whitelist_lock_20260926.py tests/test_direct_family_pick_20260926.py tests/test_bond_replace_and_hero_focus_20260924.py tests/test_solo_bond_refresh_limits_20260915.py tests/test_runtime_bond_policy_authorization_20260926.py tests/test_owner_ingame_rules_lock_20260924.py tests/test_sanguo_three_of_four_20260926.py tests/test_p0_devour_failclosed_20260917.py -q --tb=short -p no:faulthandler
          $code = $LASTEXITCODE
          Write-Host "STRATEGY_EXIT_CODE=$code"
          exit $code

      - name: Contract tests
        if: always()
        shell: pwsh
        run: |
          python -m pytest tests/contract -q --tb=short -p no:faulthandler
          $code = $LASTEXITCODE
          Write-Host "CONTRACT_EXIT_CODE=$code"
          exit $code

      - name: Release gate
        if: always()
        shell: pwsh
        run: |
          python tools/release_gate.py
          $code = $LASTEXITCODE
          Write-Host "GATE_EXIT_CODE=$code"
          exit $code
