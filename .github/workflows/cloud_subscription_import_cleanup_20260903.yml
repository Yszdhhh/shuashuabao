name: One-shot subscription annotation cleanup

on:
  push:
    branches:
      - fix/release-bound-permit-client-20260903
    paths:
      - .github/workflows/cloud_subscription_import_cleanup_20260903.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-bound-permit-client-20260903
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography

      - name: Add explicit Mapping import
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/shuabao/shell/dashboard_facade.py")
          text = path.read_text(encoding="utf-8")
          old = "from typing import Any, Callable\n"
          new = "from typing import Any, Callable, Mapping\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one typing import, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

      - name: Run affected regression tests
        run: |
          python -m pytest tests/test_subscription_release_binding.py tests/test_dashboard_facade.py tests/test_dashboard_facade_runner.py -q --tb=short
          git diff --check

      - name: Commit cleanup and remove workflow
        shell: pwsh
        run: |
          git config user.name "OpenAI Cloud Fix"
          git config user.email "openai-cloud-fix@users.noreply.github.com"
          git rm .github/workflows/cloud_subscription_import_cleanup_20260903.yml
          git add src/shuabao/shell/dashboard_facade.py
          git diff --cached --check
          git commit -m "chore(subscription): import release cache mapping type"
          git push origin HEAD:fix/release-bound-permit-client-20260903
