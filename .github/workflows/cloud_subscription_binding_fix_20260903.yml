name: One-shot release-bound permit client

on:
  push:
    branches:
      - fix/release-bound-permit-client-20260903
    paths:
      - .github/workflows/cloud_subscription_binding_fix_20260903.yml

permissions:
  contents: write

concurrency:
  group: cloud-subscription-binding-fix-20260903
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout client branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-bound-permit-client-20260903
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography

      - name: Apply release-bound client patch
        run: python tools/apply_subscription_release_binding_patch.py

      - name: Run focused subscription and shell tests
        run: |
          python -m pytest tests/test_subscription_client.py tests/test_subscription_release_binding.py tests/test_dashboard_facade.py tests/test_dashboard_facade_runner.py tests/test_permit_security_closure.py -q --tb=short
          git diff --check

      - name: Run standard release gate
        run: python tools/release_gate.py

      - name: Commit verified client patch
        shell: pwsh
        run: |
          git config user.name "OpenAI Cloud Fix"
          git config user.email "openai-cloud-fix@users.noreply.github.com"
          git rm .github/workflows/cloud_subscription_binding_fix_20260903.yml tools/apply_subscription_release_binding_patch.py
          git add src/shuabao/subscription_client.py src/shuabao/shell/live_execute.py src/shuabao/shell/runner_service.py src/shuabao/shell/dashboard_facade.py tests/test_subscription_release_binding.py
          git diff --cached --check
          git commit -m "fix(subscription): bind permit requests to verified releases"
          git push origin HEAD:fix/release-bound-permit-client-20260903
