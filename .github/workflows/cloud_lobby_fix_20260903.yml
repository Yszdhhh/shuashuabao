name: One-shot cloud lobby fix

on:
  push:
    branches:
      - trial-merge
    paths:
      - .github/workflows/cloud_lobby_fix_20260903.yml

permissions:
  contents: write

concurrency:
  group: cloud-lobby-fix-20260903
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    runs-on: windows-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: trial-merge
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography

      - name: Apply fail-closed lobby patch
        shell: python
        run: |
          import base64
          from pathlib import Path

          mediator_path = Path("src/shuabao/mediator.py")
          text = mediator_path.read_text(encoding="utf-8")

          old_ready = '''        # 优先通过模板匹配房间底部的准备/取消准备按钮
                  hit = self.find(frame, ["room_ready", "readyBtn", "room_cancel_ready"], threshold=0.75)'''
          new_ready = '''        # 只返回可执行的“准备”按钮。“取消准备”是已准备成功的后置条件，
                  # 必须保持零输入，绝不能再次点击把客人切回未准备状态。
                  hit = self.find(frame, ["room_ready", "readyBtn"], threshold=0.75)'''
          if text.count(old_ready) != 1:
              raise SystemExit(
                  f"ready button contract: expected one block, found {text.count(old_ready)}"
              )
          text = text.replace(old_ready, new_ready, 1)

          search_start = '        search_hit = self.find_scene(frame, "lobby_search_box")\n'
          search_end = '        # 3. 扫描房间列表寻找可加入的房间（非 4/4 且 非 游戏中）\n'
          if text.count(search_start) != 1:
              raise SystemExit(
                  f"search block start: expected one marker, found {text.count(search_start)}"
              )
          start = text.index(search_start)
          try:
              end = text.index(search_end, start)
          except ValueError as exc:
              raise SystemExit("search block end marker not found") from exc

          replacement = '''        search_hit = self.find_scene(frame, "lobby_search_box")
                  pending_search = self._hitch_search_pending
                  if pending_search is not None:
                      prefix, pending_at = pending_search
                      if self._hitch_search_prefix_confirmed(frame, prefix, now):
                          self._hitch_prefix_searched = True
                          self._hitch_search_pending = None
                          self._hitch_rejected_row_ys.clear()
                          print(f"[L0] hitch 搜索词 '{prefix}' 已由搜索框视觉证据确认")
                      elif now - pending_at >= 3.0:
                          self._hitch_search_pending = None
                          self._hitch_prefix_searched = False
                          self._hitch_sm.defer_retry(now)
                          print(f"[L0] hitch 搜索词 '{prefix}' 未获视觉确认，零输入重试")
                      else:
                          print(f"[L0] hitch 等待搜索词 '{prefix}' 生效确认（零输入）")
                      # 确认成立的当前 tick 仍不扫描房间；下一张新帧才允许使用过滤结果。
                      return LoopAction.Continue

                  if not getattr(self, "_hitch_prefix_searched", False):
                      prefix = self._hitch_sm.prefix
                      if search_hit is None:
                          self._hitch_sm.defer_retry(now)
                          print("[L0] hitch 未识别搜索框，零输入等待")
                          return LoopAction.Continue
                      # The shipped anchor starts halfway down the input control and
                      # includes the gap/table header below it. Its geometric centre
                      # is therefore outside the edit box on the live 1332x945 KK UI.
                      search_hit = replace(
                          search_hit,
                          screen_y=search_hit.screen_y - search_hit.h // 2,
                      )
                      if self.act_search_box(search_hit, prefix, "HitchSearchBox"):
                          self._hitch_search_pending = (prefix, now)
                          self._hitch_prefix_searched = False
                          print(
                              f"[L0] hitch 搜索词 '{prefix}' 已输入并回车，等待后置确认: "
                              f"({search_hit.screen_x}, {search_hit.screen_y})"
                          )
                      else:
                          self._hitch_sm.defer_retry(now)
                          print(f"[L0] hitch 搜索词 '{prefix}' 输入被拒绝，保持未搜索状态")
                      return LoopAction.Continue

          '''
          text = text[:start] + replacement + text[end:]
          mediator_path.write_text(text, encoding="utf-8", newline="\n")

          test_b64 = (
              "ZnJvbSBfX2Z1dHVyZV9fIGltcG9ydCBhbm5vdGF0aW9ucwoKZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmZyb20gdW5pdHRl"
