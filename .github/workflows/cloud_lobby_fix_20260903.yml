name: One-shot cloud lobby fix

on:
  push:
    branches: [ trial-merge ]
    paths: [ ".github/workflows/cloud_lobby_fix_20260903.yml" ]

permissions:
  contents: write

concurrency:
  group: cloud-lobby-fix-20260903
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    if: github.event.head_commit.message == 'chore(cloud): bootstrap lobby fix'
    runs-on: windows-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: trial-merge
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests opencv-python-headless numpy PySide6 mss pyautogui Pillow cryptography

      - name: Apply fail-closed lobby patch
        shell: python
        run: |
          from pathlib import Path

          mediator_path = Path("src/shuabao/mediator.py")
          text = mediator_path.read_text(encoding="utf-8")

          old_ready = '''    def _find_hitch_ready_button(self, frame: Frame) -> MatchResult | None:
              # 优先通过模板匹配房间底部的准备/取消准备按钮
              hit = self.find(frame, ["room_ready", "readyBtn", "room_cancel_ready"], threshold=0.75)
              if hit is not None:
                  return hit
          '''
          new_ready = '''    def _find_hitch_ready_button(self, frame: Frame) -> MatchResult | None:
              # 只返回可执行的“准备”按钮。“取消准备”是已准备成功的后置条件，
              # 必须保持零输入，绝不能再次点击把客人切回未准备状态。
              hit = self.find(frame, ["room_ready", "readyBtn"], threshold=0.75)
              if hit is not None:
                  return hit
          '''

          old_search = '''        search_hit = self.find_scene(frame, "lobby_search_box")
              # 搜索框输入后直接放行，不再要求 OCR 再次强校验（避免 OCR 对单数字误判导致 3 秒反复超时清空死锁）
              if getattr(self, "_hitch_search_pending", None) is not None:
                  self._hitch_prefix_searched = True
                  self._hitch_search_pending = None
                  self._hitch_rejected_row_ys.clear()
                  print(f"[L0] hitch 搜索词已生效，直接进入房间列表过滤与刷新循环")
              if not getattr(self, "_hitch_prefix_searched", False):
                  prefix = self._hitch_sm.prefix
                  if search_hit is None:
                      self._hitch_sm.defer_retry(now)
                      print("[L0] hitch 未识别搜索框，零输入等待")
                      return LoopAction.Continue
                  else:
                      # The shipped anchor starts halfway down the input control and
                      # includes the gap/table header below it.  Its geometric centre
                      # is therefore outside the edit box on the live 1332x945 KK UI.
                      search_hit = replace(
                          search_hit,
                          screen_y=search_hit.screen_y - search_hit.h // 2,
                      )
                  self.act_search_box(search_hit, prefix, "HitchSearchBox")
                  self._hitch_prefix_searched = True
                  print(f"[L0] hitch 搜索词 '{prefix}' 已输入并回车: ({search_hit.screen_x}, {search_hit.screen_y})")
                  return LoopAction.Continue
          '''
          new_search = '''        search_hit = self.find_scene(frame, "lobby_search_box")
              pending_search = self._hitch_search_pending
              if pending_search is not None:
                  prefix, pending_at = pending_search
                  if self._hitch_search_prefix_confirmed(frame, prefix, now):
                      self._hitch_prefix_searched = True
                      self._hitch_search_pending = None
                      self._hitch_rejected_row_ys.clear()
                      print(f"[L0] hitch 搜索词 '{prefix}' 已由搜索框视觉证据确认")
                  elif now - pending_at >= 3.0:
                      self._hitch_search_pending = None
                      self._hitch_prefix_searched = False
                      self._hitch_sm.defer_retry(now)
                      print(f"[L0] hitch 搜索词 '{prefix}' 未获视觉确认，零输入重试")
                  else:
                      print(f"[L0] hitch 等待搜索词 '{prefix}' 生效确认（零输入）")
                  # 确认成立的当前 tick 仍不扫描房间；下一张新帧才允许使用过滤结果。
                  return LoopAction.Continue

              if not getattr(self, "_hitch_prefix_searched", False):
                  prefix = self._hitch_sm.prefix
                  if search_hit is None:
                      self._hitch_sm.defer_retry(now)
                      print("[L0] hitch 未识别搜索框，零输入等待")
                      return LoopAction.Continue
                  else:
                      # The shipped anchor starts halfway down the input control and
                      # includes the gap/table header below it.  Its geometric centre
                      # is therefore outside the edit box on the live 1332x945 KK UI.
                      search_hit = replace(
                          search_hit,
                          screen_y=search_hit.screen_y - search_hit.h // 2,
                      )
                  if self.act_search_box(search_hit, prefix, "HitchSearchBox"):
                      self._hitch_search_pending = (prefix, now)
                      self._hitch_prefix_searched = False
                      print(f"[L0] hitch 搜索词 '{prefix}' 已输入并回车，等待后置确认: ({search_hit.screen_x}, {search_hit.screen_y})")
                  else:
                      self._hitch_sm.defer_retry(now)
                      print(f"[L0] hitch 搜索词 '{prefix}' 输入被拒绝，保持未搜索状态")
                  return LoopAction.Continue
          '''

          replacements = (
              ("ready button contract", old_ready, new_ready),
              ("search postcondition contract", old_search, new_search),
          )
          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact block, found {count}")
              text = text.replace(old, new, 1)

          mediator_path.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_lobby_hitch_safety_regressions.py")
          test_path.write_text('''from __future__ import annotations

from pathlib import Path
from unittest.mock import patch

import cv2
import numpy as np

from shuabao.mediator import Mediator, Phase
from shuabao.settings import Settings
from shuabao.vision.capture import Frame
from shuabao.vision.matcher import MatchResult


ROOT = Path(__file__).resolve().parents[1]


def _fixture_frame() -> Frame:
    source = ROOT / "fixtures" / "replay" / "main_line_auto_on.png"
    image = cv2.imdecode(np.fromfile(str(source), dtype=np.uint8), cv2.IMREAD_COLOR)
    assert image is not None
    return Frame(image, window_title="KK官方对战平台", hwnd=10001, role="l0")


def _search_anchor() -> MatchResult:
    return MatchResult(
        name="lobby_search_box",
        score=1.0,
        x=1095,
        y=295,
        w=185,
        h=30,
        screen_x=1346,
        screen_y=347,
    )


def test_hitch_rejected_search_input_never_marks_prefix_searched() -> None:
    med = Mediator(Settings(mode_id="lobby_hitch"), ROOT)
    anchor = _search_anchor()
    with patch.object(med, "_lobby_room_list_evidence", return_value=True), \
         patch.object(
             med,
             "find_scene",
             side_effect=lambda _frame, key: anchor if key == "lobby_search_box" else None,
         ), \
         patch.object(med, "act_search_box", return_value=False):
        med._tick_lobby_hitch(_fixture_frame(), "LOBBY_ROOM")

    assert med._hitch_search_pending is None
    assert med._hitch_prefix_searched is False


def test_hitch_search_confirmation_defers_room_scan_until_next_tick() -> None:
    med = Mediator(Settings(mode_id="lobby_hitch"), ROOT)
    med._hitch_search_pending = ("4", 100.0)
    med._hitch_search_text_override = "4"
    with patch("shuabao.mediator.time.time", return_value=101.0), \
         patch.object(med, "_lobby_room_list_evidence", return_value=True), \
         patch.object(med, "find_scene", return_value=None), \
         patch.object(med, "_find_hitch_joinable_row") as scan:
        med._tick_lobby_hitch(_fixture_frame(), "LOBBY_ROOM")

    scan.assert_not_called()
    assert med._hitch_search_pending is None
    assert med._hitch_prefix_searched is True


def test_hitch_cancel_ready_is_postcondition_not_click_target() -> None:
    med = Mediator(Settings(mode_id="lobby_hitch"), ROOT)
    cancel_ready = MatchResult(
        name="room_cancel_ready",
        score=1.0,
        x=800,
        y=600,
        w=100,
        h=30,
        screen_x=850,
        screen_y=615,
    )

    def fake_find(_frame, names, **_kwargs):
        return cancel_ready if "room_cancel_ready" in names else None

    with patch.object(med, "find", side_effect=fake_find), \
         patch.object(med, "find_scene", return_value=None), \
         patch.object(med, "_hitch_room_seat_decision", return_value="ready"), \
         patch.object(med, "act_click") as click:
        med._tick_lobby_hitch(_fixture_frame(), "ROOM_WAITING")

    click.assert_not_called()
    assert med.phase is Phase.ROOM_WAITING
''', encoding="utf-8", newline="\n")

      - name: Run focused lobby regression suite
        run: |
          python -m pytest tests/test_live_scenario_capture.py tests/test_lobby_hitch_safety_regressions.py -q --tb=short
          git diff --check

      - name: Commit verified patch and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "OpenAI Cloud Fix"
          git config user.email "openai-cloud-fix@users.noreply.github.com"
          git rm .github/workflows/cloud_lobby_fix_20260903.yml
          git add src/shuabao/mediator.py tests/test_lobby_hitch_safety_regressions.py
          git diff --cached --check
          git commit -m "fix(lobby-hitch): restore search and ready postconditions"
          git push origin HEAD:trial-merge
