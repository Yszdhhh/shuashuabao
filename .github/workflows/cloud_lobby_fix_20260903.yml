              "IiwgcmV0dXJuX3ZhbHVlPSJyZWFkeSIpLCBcCiAgICAgICAgIHBhdGNoLm9iamVjdChtZWQsICJhY3RfY2xpY2siKSBhcyBj"
              "bGljazoKICAgICAgICBtZWQuX3RpY2tfbG9iYnlfaGl0Y2goX2ZpeHR1cmVfZnJhbWUoKSwgIlJPT01fV0FJVElORyIpCgog"
              "ICAgY2xpY2suYXNzZXJ0X25vdF9jYWxsZWQoKQogICAgYXNzZXJ0IG1lZC5waGFzZSBpcyBQaGFzZS5ST09NX1dBSVRJTkcK"
          )
          test_source = base64.b64decode(test_b64).decode("utf-8")
          Path("tests/test_lobby_hitch_safety_regressions.py").write_text(
              test_source,
              encoding="utf-8",
              newline="\n",
          )

      - name: Run focused lobby regression suite
        run: |
          python -m pytest tests/test_live_scenario_capture.py tests/test_lobby_hitch_safety_regressions.py -q --tb=short
          git diff --check

      - name: Run standard release gate
        run: python tools/release_gate.py

      - name: Commit verified patch and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "OpenAI Cloud Fix"
          git config user.email "openai-cloud-fix@users.noreply.github.com"
          git rm .github/workflows/cloud_lobby_fix_20260903.yml
          git add src/shuabao/mediator.py tests/test_lobby_hitch_safety_regressions.py
          git diff --cached --check
          git commit -m "fix(lobby-hitch): restore search and ready postconditions"
          git push origin HEAD:trial-merge
